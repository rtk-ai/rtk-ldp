name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  schedule:
    - cron: "0 6 * * *"
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      - name: Fetch benchmark dashboard data from OVH S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OVH_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OVH_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.OVH_S3_REGION }}
          OVH_S3_ENDPOINT: ${{ secrets.OVH_S3_ENDPOINT }}
          OVH_S3_BUCKET: ${{ secrets.OVH_S3_BUCKET }}
        run: |
          # Add-only: committed versions are never overwritten and versions
          # absent from S3 are never deleted.
          if [ -n "$OVH_S3_BUCKET" ]; then
            pip install --quiet boto3
            python3 scripts/fetch-benchmarks.py \
              || echo "::warning::benchmark fetch failed; building with committed data"
          else
            echo "::notice::OVH S3 not configured; skipping benchmark data fetch"
          fi

      - name: Clone RTK repo
        run: git clone --depth 1 --branch ${{ vars.RTK_DOCS_REF || 'master' }} https://github.com/rtk-ai/rtk.git ./rtk-repo
        # If private: use https://x-access-token:${{ secrets.RTK_REPO_PAT }}@github.com/rtk-ai/rtk.git
        # Pin to a specific tag: set repo variable RTK_DOCS_REF=v1.5.0 in GitHub Settings → Variables → Repository variables

      - name: Prepare docs content
        run: RTK_REPO_PATH=./rtk-repo node scripts/prepare-docs.mjs

      - name: Build search index
        run: node scripts/build-search-index.mjs

      - name: Build Astro site
        run: pnpm astro build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
